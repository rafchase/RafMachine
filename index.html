// Cache
const cache = {};
function getCached(key) { const e = cache[key]; return e && Date.now() - e.ts < 300000 ? e.data : null; }
function setCache(key, data) { cache[key] = { data, ts: Date.now() }; }

// API
async function fetchSection(section, query, schema, apiKey) {
  const cached = getCached(section);
  if (cached) return cached;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-beta": "web-search-2025-03-05" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 4000,
      tools: [{ type: "web_search_20250305", name: "web_search" }],
      system: "Você é um especialista em EA FC 26 Ultimate Team. Pesquise dados atualizados e retorne APENAS um objeto JSON válido, sem markdown. Responda em português brasileiro.",
      messages: [{ role: "user", content: `Pesquise dados sobre: ${query}\n\nRetorne SOMENTE JSON neste formato:\n${schema}` }]
    })
  });
  const data = await response.json();
  const text = data.content.filter(b => b.type === "text").map(b => b.text).join("");
  const clean = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
  const parsed = JSON.parse(clean);
  setCache(section, parsed);
  return parsed;
}

  const h = Math.max(0, Math.floor((new Date(iso) - Date.now()) / 3600000));

const PesquisarJogadores = ({ apiKey }) => {

  const pesquisar = async () => {
    setLoading(true);
    await new Promise(r=>setTimeout(r,600));
    let res = mockJogadores.filter(p => {
      const ovr = p.overall_apos || p.overall_atual;

    <div className="animate-fadeIn">

const ObjetivosAtivos = ({ apiKey }) => {
  const [data] = useState(mockObjetivos);
  const [countdowns, setCountdowns] = useState({});
  const [lastUp, setLastUp] = useState(null);

  useEffect(() => {
    const timer = setInterval(() => {
      const now = {};
      data.forEach(o => {
        if (o.horas_restantes < 24) {
          const ms = new Date(o.expira_em) - Date.now();
          if (ms > 0) {
            const h = Math.floor(ms/3600000);
            const m = Math.floor((ms%3600000)/60000);
            const s = Math.floor((ms%60000)/1000);
            now[o.id] = `${h}h ${m}m ${s}s`;
          }
        }
      });
      setCountdowns(now);
    }, 1000);
    return () => clearInterval(timer);
  }, [data]);

  const rewardIcon = t => t==='pack'?'📦':t==='jogador'?'👤':t==='moedas'?'🪙':t==='evolucao'?'⬆️':'🎁';
  const progresses = data.reduce((acc,o)=>{acc[o.id]=Math.floor(Math.random()*100);return acc;},{});

  return (
    <div className="animate-fadeIn">
      <div className="flex justify-between items-center mb-4">
        <h1 className="text-3xl font-black font-orbitron text-yellow-400">🎯 Objetivos Ativos</h1>
        <button onClick={()=>setLastUp(new Date())} className="btn-primary px-4 py-2 rounded-xl font-rajdhani text-sm">🔄 Atualizar</button>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {[...data].sort((a,b)=>a.horas_restantes-b.horas_restantes).map(o=>{
          const prog = progresses[o.id];
          return (
            <div key={o.id} className="glass glass-hover rounded-xl p-4">
              <div className="flex justify-between items-start mb-2">
                <h3 className="font-bold text-white">{o.nome}</h3>
                <ExpiryBadge horas={o.horas_restantes}/>
              </div>
              <div className="flex items-center gap-2 mb-3">
                <span className="text-2xl">{rewardIcon(o.tipo_recompensa)}</span>
                <div>
                  <div className="text-sm font-bold text-yellow-300">{o.recompensa}</div>
                  <div className="text-xs text-gray-400">Dificuldade: {o.dificuldade}</div>
                </div>
              </div>
              <div className="space-y-1 mb-3">
                {o.requisitos.map((r,i)=><div key={i} className="text-xs text-gray-400 flex items-center gap-1"><span className="text-green-400">•</span>{r}</div>)}
              </div>
              <div className="mb-2">
                <div className="flex justify-between text-xs text-gray-400 mb-1"><span>Progresso</span><span>{prog}%</span></div>
                <div className="bg-gray-800 rounded-full h-2">
                  <div className="h-2 rounded-full bg-gradient-to-r from-yellow-500 to-green-500 transition-all" style={{width:`${prog}%`}}/>
                </div>
              </div>
              {countdowns[o.id] && (
                <div className="text-red-400 text-xs font-bold font-orbitron animate-pulse-custom">⏱️ {countdowns[o.id]}</div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

      case 'evolucoes': return <Evolucoes {...props}/>;
      case 'jogadores': return <Jogadores {...props}/>;
      case 'custo': return <CustoBeneficio {...props}/>;
      case 'montartime': return <MontarTime {...props}/>;
      case 'pesquisar': return <PesquisarJogadores {...props}/>;
      case 'objetivos': return <ObjetivosAtivos {...props}/>;
      case 'sbcs': return <SBCsSection {...props}/>;
      case 'calcular': return <CalcularElenco {...props}/>;
      case 'destaques': return <DestaquesdaSemana {...props}/>;
      default: return <Dashboard {...props} setSection={setActiveSection}/>;
    }
  };

  return (
    <div className="min-h-screen" style={{background:'#0a0a0f'}}>
      {showApiModal && <ApiKeyModal onSave={handleSaveKey} onSkip={handleSkip}/>}

      {/* Desktop Sidebar */}
      <div className={`sidebar-desktop fixed left-0 top-0 h-full z-50 ${sidebarOpen?'w-64':'w-16'}`} style={{background:'#0d0d1a',borderRight:'1px solid rgba(255,215,0,0.1)'}}>
        <div className="flex items-center justify-between p-4 border-b border-yellow-500/10">
          {sidebarOpen && (
            <div>
              <div className="font-orbitron font-black text-yellow-400 text-sm">EA FC 26</div>
              <div className="font-rajdhani text-gray-400 text-xs">UT Analyzer</div>
            </div>
          )}
          <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="text-gray-400 hover:text-yellow-400 text-lg ml-auto">
            {sidebarOpen?'◀':'▶'}
          </button>
        </div>
        <nav className="py-4">
          {navItems.map(item=>(
            <button key={item.id} onClick={()=>setActiveSection(item.id)}
              className={`nav-item w-full flex items-center gap-3 px-4 py-3 text-left font-rajdhani transition-all border-l-3 ${activeSection===item.id?'active':''}`}
              style={{color: activeSection===item.id?'#FFD700':'#9ca3af'}}>
              <span className="text-xl flex-shrink-0">{item.icon}</span>
              {sidebarOpen && <span className="text-sm font-semibold truncate">{item.label}</span>}
            </button>
          ))}
        </nav>
        {sidebarOpen && (
          <div className="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-800">
            <button onClick={()=>setShowApiModal(true)} className="btn-secondary w-full py-2 rounded-lg text-xs font-rajdhani flex items-center justify-center gap-2">
              🔑 {apiKey?'Mudar API Key':'Configurar API Key'}
            </button>
            {!apiKey && <div className="text-xs text-orange-400 mt-1 text-center">⚠️ Dados mock ativos</div>}
          </div>
        )}
      </div>

      {/* Main Content */}
      <div className="main-content min-h-screen" style={{marginLeft: sidebarOpen?'256px':'64px', transition:'margin 0.3s ease'}}>
        <div className="p-4 md:p-6 max-w-7xl">
          {renderSection()}
        </div>
      </div>

      {/* Mobile Bottom Nav */}
      <nav className="bottom-nav fixed bottom-0 left-0 right-0 z-50 overflow-x-auto" style={{background:'#0d0d1a',borderTop:'1px solid rgba(255,215,0,0.2)'}}>
        <div className="flex" style={{minWidth:'max-content'}}>
          {navItems.map(item=>(
            <button key={item.id} onClick={()=>setActiveSection(item.id)}
              className={`flex flex-col items-center px-3 py-2 ${activeSection===item.id?'text-yellow-400':'text-gray-500'}`}
              style={{minWidth:'60px'}}>
              <span className="text-lg">{item.icon}</span>
              <span className="text-xs font-rajdhani" style={{fontSize:'9px',maxWidth:'55px',textAlign:'center',lineHeight:'1.2'}}>{item.label}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>

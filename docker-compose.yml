version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cpf-api:latest
    container_name: cpf-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
